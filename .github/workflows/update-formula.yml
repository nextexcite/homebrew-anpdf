name: Update formula
on:
  # Fired by anPDF's release workflow (oci.yml) after each release is published.
  repository_dispatch:
    types: [anpdf-release]
  # Fallback poller; GitHub schedules on low-activity repos are best-effort.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-formula
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update formula from the newest stable anPDF release
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_TAG" ]; then
            # anPDF's release job carries the tag it just published.
            tag="$DISPATCH_TAG"
            if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "dispatch payload tag '$tag' is not a plain v<version> tag" >&2
              exit 1
            fi
            if [ "$(gh api "repos/nextexcite/anPDF/releases/tags/$tag" --jq '.draft')" != "false" ]; then
              echo "release $tag is a draft or does not exist" >&2
              exit 1
            fi
          else
            # anPDF publishes milestones as prereleases, so releases/latest is empty;
            # pick the newest non-draft release whose tag is a plain v<version>.
            tag=$(gh api 'repos/nextexcite/anPDF/releases?per_page=20' \
              --jq '[.[] | select(.draft | not) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))][0]')
          fi
          test -n "$tag"
          echo "latest: $tag"
          version=${tag#v}
          expected="anpdf-$version-macos-arm64.tar.gz"
          url="https://github.com/nextexcite/anPDF/releases/download/$tag/$expected"
          asset=$(gh api "repos/nextexcite/anPDF/releases/tags/$tag" \
            --jq '.assets[] | select(.name == "SHA256SUMS-macos-arm64.txt") | .browser_download_url')
          test -n "$asset"
          sha=$(curl -fsSL "$asset" | awk -v f="$expected" '$2 == f {print $1}')
          test -n "$sha"
          python3 - "$url" "$sha" <<'PY'
          import pathlib, re, sys
          url, sha = sys.argv[1], sys.argv[2]
          p = pathlib.Path("Formula/anpdf.rb")
          s = p.read_text()
          s = re.sub(r'url ".*"', f'url "{url}"', s, count=1)
          s = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{sha}"', s, count=1)
          p.write_text(s)
          PY
          ruby -c Formula/anpdf.rb
          echo "tag=$tag" >> "$GITHUB_ENV"
      - name: Commit formula changes
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "formula already current"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "update anpdf to ${{ env.tag }}"
          git push
